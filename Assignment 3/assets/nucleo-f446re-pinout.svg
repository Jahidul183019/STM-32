<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="800" viewBox="0 0 1400 800">
  <defs>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e4e4e4"/>
      <stop offset="100%" stop-color="#d3d3d3"/>
    </linearGradient>
    <style>
      .title { font: 600 44px Arial, Helvetica, sans-serif; fill: #111; }
      .label { font: 600 24px Arial, Helvetica, sans-serif; fill: #111; }
      .small { font: 400 18px Arial, Helvetica, sans-serif; fill: #333; }
      .pin { font: 700 18px Arial, Helvetica, sans-serif; fill: #fff; }
      .chip { font: 400 19px Arial, Helvetica, sans-serif; fill: #000; }
      .note { font: 400 16px Arial, Helvetica, sans-serif; fill: #222; }
    </style>
  </defs>

  <rect width="100%" height="100%" fill="#fff"/>

  <rect x="390" y="60" width="620" height="580" rx="10" fill="url(#board)"/>
  <text x="700" y="165" text-anchor="middle" class="title">NUCLEO-F446RE</text>

  <rect x="620" y="215" width="160" height="75" rx="10" fill="#cfcfcf" opacity="0.65"/>
  <text x="700" y="260" text-anchor="middle" class="chip">Board pinout summary</text>

  <text x="420" y="335" class="label">Part A - SPI</text>
  <text x="420" y="370" class="small">PC1  - SPI2_MOSI</text>
  <text x="420" y="400" class="small">PC2  - SPI2_MISO</text>
  <text x="420" y="430" class="small">PC7  - SPI2_SCK</text>
  <text x="420" y="460" class="small">PB9  - CS (active low)</text>
  <text x="420" y="490" class="small">PA2  - USART2_TX</text>
  <text x="420" y="520" class="small">PA3  - USART2_RX</text>

  <text x="800" y="335" class="label">Part B - I2C</text>
  <text x="800" y="370" class="small">PB6  - I2C1_SCL</text>
  <text x="800" y="400" class="small">PB7  - I2C1_SDA</text>
  <text x="800" y="430" class="small">PA2  - USART2_TX</text>
  <text x="800" y="460" class="small">PA3  - USART2_RX</text>

  <rect x="470" y="560" width="120" height="32" rx="6" fill="#2f6fff"/>
  <text x="530" y="582" text-anchor="middle" class="pin">SPI pins</text>

  <rect x="790" y="560" width="120" height="32" rx="6" fill="#2aa876"/>
  <text x="850" y="582" text-anchor="middle" class="pin">I2C pins</text>

  <text x="700" y="710" text-anchor="middle" class="note">Generated reference for Assignment 3 Part A and Part B pin configuration</text>
</svg>